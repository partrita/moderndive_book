name: deploy-quarto

on:
  push:
    branches: [main, master, quarto-book]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v2
        with:
          pixi-version: v0.39.5
          cache: true

      - name: Install System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inconsolata fonts-nanum
          sudo fc-cache -fv

      - name: Setup R packages (CRAN)
        run: pixi run setup-r

      - name: Render Quarto Book
        run: pixi run render

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: mybook/_book
          branch: gh-pages
          clean: true
