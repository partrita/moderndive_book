[workspace]
authors = ["deepthought <deepthough@postech.ac.kr>"]
channels = ["conda-forge"]
name = "ModernDive_book"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
render = "quarto render mybook"
preview = "quarto preview mybook"
setup-r = { cmd = "Rscript -e 'if (!require(\"remotes\")) install.packages(\"remotes\", repos=\"https://cran.rstudio.com\"); if (!require(\"pak\")) install.packages(\"pak\", repos=\"https://cran.rstudio.com\"); pak::pkg_install(c(\"moderndive\", \"ggplot2movies\"))'" }

[dependencies]
quarto = ">=1.8.27"
r-base = ">=4.4.2"
r-tidyverse = ">=2.0.0"
r-rmarkdown = "*"
r-knitr = "*"
